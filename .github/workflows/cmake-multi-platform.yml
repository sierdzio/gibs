# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux-GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            run_tests: true
          - os: ubuntu-latest
            name: Linux-Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            run_tests: true
          - os: windows-latest
            name: Windows-MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            run_tests: false

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev googletest

      - name: Configure CMake
        shell: bash
        run: |
          TEST_FLAGS="-DBUILD_TESTS=OFF -DBUILD_SAMPLE_TESTS=OFF"
          if [[ "${{ matrix.run_tests }}" == "true" ]]; then
            TEST_FLAGS="-DBUILD_TESTS=ON -DBUILD_SAMPLE_TESTS=ON"
          fi

          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
            ${TEST_FLAGS}

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --config "${{ matrix.build_type }}" --parallel 2

      - name: Test
        if: ${{ matrix.run_tests }}
        shell: bash
        run: |
          ctest --test-dir "${{ github.workspace }}/build" --output-on-failure --build-config "${{ matrix.build_type }}"
